# =============================================================================
# Security response headers, included from EVERY location block in nginx.conf.
#
# Why an include instead of a single server-level block: nginx only inherits
# `add_header` from the enclosing level when the current level declares none.
# Every location here sets its own Cache-Control, so server-level headers were
# silently dropped from index.html and the hashed assets. Including this file in
# each location keeps the headers on every response.
#
# Content-Security-Policy notes:
#   - script-src: only same-origin bundles plus the sha256 of the inline theme
#     bootstrap script in src/index.html. If you edit that script, recompute the
#     hash (the csp-hash spec fails the build until you do).
#   - style-src 'unsafe-inline': Angular/Material inject component styles and the
#     inlined Google Fonts CSS as <style> elements.
#   - img-src allows http/https: item and plan images are served by the backend
#     storage base URL, which is a different origin in some deployments.
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MbyaNg7sSDzMIwxoQOgSlJsf2z6elZbThXilC242RdA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
