<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-label="Página no encontrada">
  <defs>
    <linearGradient id="nf-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a6b" />
      <stop offset="60%" stop-color="#6f5b95" />
      <stop offset="100%" stop-color="#a59ad0" />
    </linearGradient>
    <radialGradient id="nf-glow" cx="50%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#fff8e3" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fff8e3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nf-stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e6f1" />
      <stop offset="100%" stop-color="#b8b3cf" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="320" height="280" rx="24" fill="url(#nf-bg)" />
  <rect width="320" height="280" rx="24" fill="url(#nf-glow)" />

  <!-- ground / horizon -->
  <path d="M 0 240 Q 160 218 320 240 L 320 280 L 0 280 Z" fill="#000000" opacity="0.20" />
  <path d="M 0 252 Q 160 235 320 252 L 320 280 L 0 280 Z" fill="#000000" opacity="0.18" />

  <!-- left flower stalk -->
  <path d="M 64 248 Q 60 220 70 192" stroke="#a8e6d9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="70" cy="190" r="6" fill="#ffe9a3" opacity="0.95" />
  <circle cx="70" cy="190" r="3" fill="#f5a96a" />
  <!-- left flower leaf -->
  <path d="M 62 230 Q 50 222 54 214 Q 64 220 62 230 Z" fill="#a8e6d9" opacity="0.75" />

  <!-- right flower stalk -->
  <path d="M 256 248 Q 262 220 250 196" stroke="#a8e6d9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="250" cy="194" r="6" fill="#ffe9a3" opacity="0.95" />
  <circle cx="250" cy="194" r="3" fill="#f5a96a" />
  <path d="M 258 230 Q 270 222 266 214 Q 256 220 258 230 Z" fill="#a8e6d9" opacity="0.75" />

  <!-- gravestone shadow -->
  <ellipse cx="160" cy="246" rx="74" ry="6" fill="#000000" opacity="0.30" />

  <!-- gravestone body — rounded-top rectangle -->
  <path
    d="M 110 244 L 110 138 Q 110 92 160 92 Q 210 92 210 138 L 210 244 Z"
    fill="url(#nf-stone)"
    stroke="#2a2240"
    stroke-width="1.5"
    opacity="0.96"
  />

  <!-- engraved cross at the top -->
  <rect x="156" y="106" width="8" height="26" rx="2" fill="#7d76a3" opacity="0.55" />
  <rect x="148" y="114" width="24" height="8" rx="2" fill="#7d76a3" opacity="0.55" />

  <!-- 404 numerals carved into the stone -->
  <text
    x="160"
    y="200"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-weight="700"
    font-size="60"
    fill="#3a2f5c"
    opacity="0.78"
    letter-spacing="-2"
  >404</text>

  <!-- tiny X_X face below the numerals: two X eyes -->
  <g stroke="#3a2f5c" stroke-width="2.4" stroke-linecap="round" opacity="0.78">
    <line x1="138" y1="216" x2="148" y2="226" />
    <line x1="148" y1="216" x2="138" y2="226" />
    <line x1="172" y1="216" x2="182" y2="226" />
    <line x1="182" y1="216" x2="172" y2="226" />
  </g>
  <!-- straight mouth -->
  <line x1="150" y1="232" x2="170" y2="232" stroke="#3a2f5c" stroke-width="2" stroke-linecap="round" opacity="0.78" />
</svg>
