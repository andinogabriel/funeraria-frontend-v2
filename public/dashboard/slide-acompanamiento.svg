<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Acompañamiento">
  <defs>
    <linearGradient id="acomp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3a3f" />
      <stop offset="55%" stop-color="#386761" />
      <stop offset="100%" stop-color="#6ba59b" />
    </linearGradient>
    <radialGradient id="acomp-glow-a" cx="30%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#a8e6d9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a8e6d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="acomp-glow-b" cx="68%" cy="65%" r="32%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
