  <rect width="1600" height="600" fill="url(#acomp-bg)" />
  <rect width="1600" height="600" fill="url(#acomp-glow-a)" />
  <rect width="1600" height="600" fill="url(#acomp-glow-b)" />
  <!-- Two interlocking soft blobs symbolising compañía -->
  <ellipse cx="540" cy="280" rx="200" ry="180" fill="#ffffff" opacity="0.05" />
  <ellipse cx="720" cy="350" rx="200" ry="180" fill="#a8e6d9" opacity="0.08" />
  <path d="M 0 480 C 300 420 500 500 800 460 S 1300 420 1600 460 L 1600 600 L 0 600 Z" fill="#ffffff" opacity="0.05" />
