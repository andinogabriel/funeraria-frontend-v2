# =============================================================================
# nginx configuration for the funeraria-frontend-v2 Docker image.
#
# Responsibilities:
#   1. Serve the Angular SPA from /usr/share/nginx/html.
#   2. Fall back to /index.html for any unknown route so the Angular Router
#      takes over (deep links into /afiliados/42 must reach the app, not 404).
#   3. Reverse-proxy /api and /actuator to the backend so the browser sees the
#      same origin in dev and prod — no CORS preflights, no env-specific
#      base-URLs in the bundle.
#
# The `backend` upstream resolves via Docker Compose service DNS when this
# image runs inside the compose network. Override with --build-arg or env
# substitution if you point it at a remote backend.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Required so the `proxy_pass` upstream
    # below resolves lazily at request time instead of at nginx startup; the
    # eager resolution would refuse to start the container when the backend
    # is not yet up (eg. frontend-only profile in docker-compose).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Pinning the upstream host into a variable forces nginx to use the
    # `resolver` directive above on every request — the bare `proxy_pass
    # http://backend:8081` form would inline DNS at config-parse time.
    set $backend_upstream "backend:8081";

    # gzip on JSON, JS, CSS, SVG, fonts — the Angular bundle compresses to
    # roughly a third of its original size, which matters on the first paint.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ----- Hashed assets ----------------------------------------------------
    # Angular emits filenames with content hashes (main-ABC123.js, ...). Those
    # are immutable: any change produces a new filename, so we can cache them
    # aggressively. The HTML entry point is the exception below.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ----- Backend reverse proxy --------------------------------------------
    # /api and /actuator forward to the backend service. Same-origin from the
    # browser's perspective, so the HTTP interceptor that injects Bearer
    # tokens and the device-id header does not need a separate CORS round
    # trip. `proxy_pass` without a trailing slash preserves the original URI.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # The activity feed will eventually flip to SSE; preserving the
        # Upgrade / Connection headers leaves the door open without a re-tune.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- SPA history fallback ---------------------------------------------
    # Anything that did not match a static file or the proxy paths above is
    # a client-side route. Serve index.html and let the Angular Router resolve
    # it. The `try_files` form avoids the redirect loop a naive `rewrite`
    # would produce.
    location / {
        try_files $uri $uri/ /index.html;

        # The HTML entry must not be cached — it carries the references to
        # the hashed bundle files, and a stale index.html points at JS that
        # is no longer on disk after a deploy.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ----- Security headers -------------------------------------------------
    # Conservative defaults — tighten in deploy if a stricter CSP is needed.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "interest-cohort=()" always;
}
