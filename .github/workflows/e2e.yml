name: E2E

# Playwright against the real stack: Postgres + the backend built from its master branch + this
# frontend image. Catches contract drift between the two repositories that unit tests (which
# mock HTTP) cannot see.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch, tag or SHA to test against"
        required: false
        default: "master"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          repository: andinogabriel/backend-funeraria-app
          ref: ${{ inputs.backend_ref || 'master' }}
          path: backend-funeraria-app

      - name: Start the stack
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend-funeraria-app
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --build --wait --wait-timeout 420

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          E2E_BASE_URL: http://localhost:4280
        run: npm run e2e

      - name: Stack logs on failure
        if: failure()
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend-funeraria-app
        run: docker compose -f e2e/docker-compose.e2e.yml logs --no-color --tail=300

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend-funeraria-app
        run: docker compose -f e2e/docker-compose.e2e.yml down -v
