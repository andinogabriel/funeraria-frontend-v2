<mat-card
  class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
>
  <!--
    Action toolbar. Filtering now lives inside each column header menu (commit
    via Aceptar), so the toolbar no longer carries a search field — only the
    row-action buttons split between an icon-only mobile presentation
    (`mat-icon-button`) and a labelled desktop one (`mat-stroked-button`). The
    toolbar collapses entirely when no actions are configured so the card's
    top edge sits flush with the data-table header.
  -->
  @if (actions().length > 0) {
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      <span class="flex-1"></span>

      <div class="flex items-center gap-0 shrink-0 sm:hidden">
        @for (action of actions(); track action.id) {
          <button
            mat-icon-button
            [color]="action.kind === 'warn' ? 'warn' : undefined"
            [disabled]="action.disabled"
            (click)="action.handler()"
            [matTooltip]="action.tooltip ?? action.label"
            [attr.aria-label]="action.tooltip ?? action.label"
          >
            <mat-icon class="material-symbols-outlined">{{ action.icon }}</mat-icon>
          </button>
        }
      </div>

      <div class="hidden sm:flex items-center gap-2 shrink-0">
        @for (action of actions(); track action.id) {
          <button
            mat-stroked-button
            [color]="action.kind === 'warn' ? 'warn' : undefined"
            [disabled]="action.disabled"
            (click)="action.handler()"
            [matTooltip]="action.tooltip ?? action.label"
            [attr.aria-label]="action.tooltip ?? action.label"
          >
            <mat-icon class="material-symbols-outlined">{{ action.icon }}</mat-icon>
            {{ action.label }}
          </button>
        }
      </div>
    </div>
  }

  <!--
    The data-table owns loading (inline skeleton rows), empty state (centered
    icon + title + body inside the same fixed-height viewport), and the has-data
    branch. Filtering is per-column: `columnMenuApply` events feed back into the
    wrapper's `committedFilters` signal, which drives `filteredData` and is
    forwarded as `[columnFilters]` so the data-table re-populates its staged
    inputs on every menu open.
  -->
  <app-data-table
    [data]="filteredData()"
    [columns]="columns()"
    [trackBy]="trackBy()"
    [storageKey]="storageKey()"
    [initialSort]="initialSort()"
    [initialPageSize]="10"
    [hideColumnChooser]="true"
    [hidePageSizeSelector]="true"
    [selectable]="true"
    [loading]="loading()"
    [emptyState]="effectiveEmptyState()"
    [columnFilters]="committedFilters()"
    (columnMenuApply)="onColumnMenuApply($event)"
    [(selectedRow)]="selectedRow"
  />
</mat-card>
