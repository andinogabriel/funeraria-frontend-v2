<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      group
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Afiliados</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Gestioná el padrón de afiliados activos.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header controls cluster.
      - On mobile (default): freshness indicator stacks ABOVE the row of action
        buttons (right-aligned). Without this layer the wide "Actualizado hace
        N min" label pushed each button onto its own line under flex-wrap.
      - On sm+: everything sits inline as before. The compact freshness stamp
        re-renders every 30 s and the visibility-change auto-refresh kicks in
        when the tab is backgrounded for >60 s.
    -->
    <div
      class="flex w-full flex-col items-end gap-2 sm:w-auto sm:flex-row sm:items-center sm:gap-3"
    >
      <app-freshness-indicator [updatedAt]="pageFetchedAt()" />

      <div class="flex flex-row flex-wrap items-center justify-end gap-2 sm:gap-3">
        <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
          <mat-icon class="material-symbols-outlined">refresh</mat-icon>
          Actualizar
        </button>
        @if (isAdmin()) {
          <!--
            Admin-only access to the soft-delete papelera. Sibling action on the
            parent surface, not a peer destination in the sidebar — keeps the
            nav focused while still giving admins one click to the audit view.
          -->
          <a
            mat-stroked-button
            routerLink="/afiliados/eliminados"
            matTooltip="Ver afiliados eliminados"
            aria-label="Papelera"
          >
            <mat-icon class="material-symbols-outlined">delete_outline</mat-icon>
            Papelera
          </a>
        }
        <a mat-flat-button color="primary" routerLink="/afiliados/nuevo">
          <mat-icon class="material-symbols-outlined">add</mat-icon>
          Nuevo afiliado
        </a>
      </div>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <!--
    Mat-card wrapper + in-card toolbar match the structure used by the other server-side
    list view (incomes). The toolbar carries the "Limpiar filtros" affordance on the LEFT
    when at least one filter is committed, plus the icon-only row actions on the RIGHT
    (44 px circular tap targets with Spanish tooltips). First-load shows the data-table's
    inline skeleton; refresh fetches keep the previous rows visible (stale-while-
    revalidate) so the table never flashes.
  -->
  <mat-card
    class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
  >
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          matTooltip="Limpiar todos los filtros aplicados"
          aria-label="Limpiar filtros"
        >
          <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
          Limpiar filtros
        </button>
      }

      <span class="flex-1"></span>

      <div class="flex items-center gap-1 shrink-0">
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onShowDetail()"
          matTooltip="Ver detalle"
          aria-label="Ver detalle del afiliado seleccionado"
        >
          <mat-icon class="material-symbols-outlined">visibility</mat-icon>
        </button>
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onEdit()"
          matTooltip="Editar"
          aria-label="Editar afiliado seleccionado"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          [disabled]="!hasSelection()"
          (click)="onDelete()"
          matTooltip="Eliminar"
          aria-label="Eliminar afiliado seleccionado"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </div>

    <app-data-table
      [data]="rows()"
      [columns]="columns()"
      [trackBy]="trackByDni"
      storageKey="affiliates.list"
      [serverSide]="true"
      [loading]="loading()"
      [totalElements]="totalElements()"
      [initialSort]="sortState()"
      [initialPageIndex]="pageIndex()"
      [initialPageSize]="pageSize()"
      [columnFilters]="columnFilters()"
      [emptyState]="emptyState()"
      [selectable]="true"
      [(selectedRow)]="selectedAffiliate"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (columnMenuApply)="onColumnMenuApply($event)"
    />
  </mat-card>
</div>

<!--
  Cell renderer for the Nacimiento column. The column's `value` accessor still
  returns the raw ISO `yyyy-MM-dd` so the grid sort stays chronological; this
  template runs the canonical `formatDate` helper so the operator sees
  `dd/MM/yyyy`.
-->
<ng-template #birthDateCell let-affiliate>{{ formatDate(affiliate.birthDate) }}</ng-template>
