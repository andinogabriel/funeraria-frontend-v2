<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <a mat-icon-button routerLink="/afiliados" aria-label="Volver al listado">
      <mat-icon class="material-symbols-outlined">arrow_back</mat-icon>
    </a>
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      delete_outline
    </mat-icon>
    <div class="flex flex-col min-w-0">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Papelera</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Afiliados eliminados. Solo consulta — sin restaurar ni purgar.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header controls cluster. On mobile the freshness stamp sits vertically
      above the Actualizar button; on sm+ they sit inline. Same shape used
      across every list page.
    -->
    <div class="flex w-full justify-end sm:w-auto sm:justify-start">
      <div class="flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:gap-3">
        <app-freshness-indicator [updatedAt]="pageFetchedAt()" />

        <div class="flex flex-row items-center gap-2 sm:gap-3">
          <button
            mat-stroked-button
            (click)="onRefresh()"
            [disabled]="loading()"
            matTooltip="Actualizar"
            aria-label="Actualizar"
          >
            <mat-icon class="material-symbols-outlined">refresh</mat-icon>
            <span class="hidden sm:inline">Actualizar</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <!--
    Mat-card wrapper + in-card toolbar match the structure used by every other
    server-side list (affiliates, incomes, items, funerals). Toolbar carries
    the "Limpiar filtros" affordance on the LEFT when at least one filter is
    committed, plus the Detalle icon-only action on the RIGHT.
  -->
  <mat-card
    class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
  >
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          matTooltip="Limpiar todos los filtros aplicados"
          aria-label="Limpiar filtros"
        >
          <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
          Limpiar filtros
        </button>
      }

      <span class="flex-1"></span>

      <div class="flex items-center gap-1 shrink-0">
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onShowDetail()"
          matTooltip="Ver detalle"
          aria-label="Ver detalle del afiliado seleccionado"
        >
          <mat-icon class="material-symbols-outlined">visibility</mat-icon>
        </button>
      </div>
    </div>

    <app-data-table
      [data]="rows()"
      [columns]="columns()"
      [trackBy]="trackByDni"
      storageKey="affiliates.bin"
      [serverSide]="true"
      [loading]="loading()"
      [totalElements]="totalElements()"
      [initialPageIndex]="pageIndex()"
      [initialPageSize]="pageSize()"
      [columnFilters]="columnFilters()"
      [emptyState]="emptyState()"
      [selectable]="true"
      [(selectedRow)]="selectedAffiliate"
      (pageChange)="onPageChange($event)"
      (columnMenuApply)="onColumnMenuApply($event)"
    />
  </mat-card>
</div>

<!--
  Cell renderer for the Eliminado column. The column's `value` accessor
  returns the raw ISO instant; this template runs the canonical
  `formatDateTime` so the operator sees `dd/MM/yyyy HH:mm` in Argentina
  local time.
-->
<ng-template #deletedAtCell let-affiliate>
  {{ affiliate.deletedAt ? formatDateTime(affiliate.deletedAt) : '—' }}
</ng-template>
