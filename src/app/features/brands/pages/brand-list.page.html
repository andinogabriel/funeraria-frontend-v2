<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      sell
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Marcas</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Catálogo de marcas referenciadas por los items.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header buttons cluster. Brands has no freshness indicator (catalog rarely
      changes), so the wrapper exists just to keep Actualizar / Nueva marca on
      a single row on mobile under the title block — same shape as plans /
      categorias / proveedores.
    -->
    <!--
      Same mobile-shrink pattern used across every list page: Actualizar
      collapses to icon-only on mobile; primary CTA keeps "Nueva" visible.
    -->
    <div class="flex flex-row items-center justify-end gap-2 sm:gap-3">
      <button
        mat-stroked-button
        (click)="onRefresh()"
        [disabled]="loading()"
        matTooltip="Actualizar"
        aria-label="Actualizar"
      >
        <mat-icon class="material-symbols-outlined">refresh</mat-icon>
        <span class="hidden sm:inline">Actualizar</span>
      </button>
      <a mat-flat-button color="primary" routerLink="/marcas/nueva">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
        Nueva<span class="hidden sm:inline"> marca</span>
      </a>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <app-selection-list-card
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackById"
    storageKey="brands.list"
    [initialSort]="{ active: 'name', direction: 'asc' }"
    [loading]="loading()"
    emptyIcon="sell"
    emptyTitle="No hay marcas que coincidan con la búsqueda."
    emptyHint="Probá con otro criterio o sumá una nueva marca."
    [actions]="actions()"
    [(selectedRow)]="selectedBrand"
  />
</div>
