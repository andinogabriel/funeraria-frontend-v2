<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      local_shipping
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Proveedores</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Padrón de proveedores con datos de contacto y direcciones.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header buttons cluster. Proveedores has no freshness indicator; the
      wrapper keeps Actualizar / Nuevo proveedor on a single row on mobile
      under the title block — same shape as marcas / categorias / planes.
    -->
    <div class="flex flex-row flex-wrap items-center justify-end gap-2 sm:gap-3">
      <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
        <mat-icon class="material-symbols-outlined">refresh</mat-icon>
        Actualizar
      </button>
      <a mat-flat-button color="primary" routerLink="/proveedores/nuevo">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
        Nuevo proveedor
      </a>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <app-selection-list-card
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackByNif"
    storageKey="suppliers.list"
    [initialSort]="{ active: 'name', direction: 'asc' }"
    [loading]="loading()"
    emptyIcon="local_shipping"
    emptyTitle="No hay proveedores que coincidan con la búsqueda."
    emptyHint="Probá con otro criterio o sumá un nuevo proveedor."
    [actions]="actions()"
    [(selectedRow)]="selectedSupplier"
  />
</div>
