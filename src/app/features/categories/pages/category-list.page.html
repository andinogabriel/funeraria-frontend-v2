<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      category
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Categorías</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Catálogo de categorías para clasificar items.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header buttons cluster. Categorías has no freshness indicator (catalog
      rarely changes); the wrapper keeps Actualizar / Nueva categoría on a
      single row on mobile under the title block.
    -->
    <!--
      Same mobile-shrink pattern used across every list page: Actualizar
      collapses to icon-only on mobile; primary CTA keeps "Nueva" visible.
    -->
    <div class="flex flex-row items-center justify-end gap-2 sm:gap-3">
      <button
        mat-stroked-button
        (click)="onRefresh()"
        [disabled]="loading()"
        matTooltip="Actualizar"
        aria-label="Actualizar"
      >
        <mat-icon class="material-symbols-outlined">refresh</mat-icon>
        <span class="hidden sm:inline">Actualizar</span>
      </button>
      <a mat-flat-button color="primary" routerLink="/categorias/nueva">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
        Nueva<span class="hidden sm:inline"> categoría</span>
      </a>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <app-selection-list-card
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackById"
    storageKey="categories.list"
    [initialSort]="{ active: 'name', direction: 'asc' }"
    [loading]="loading()"
    emptyIcon="category"
    emptyTitle="No hay categorías que coincidan con la búsqueda."
    emptyHint="Probá con otro criterio o sumá una nueva categoría."
    [actions]="actions()"
    [(selectedRow)]="selectedCategory"
  />
</div>
