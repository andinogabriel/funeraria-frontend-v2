<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      church
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Servicios</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Servicios funerarios registrados.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header controls cluster. On mobile (default) the freshness stamp sits
      vertically ABOVE the leftmost button (Actualizar) so the operator's eye
      goes from "Actualizado hace N min" → Actualizar without crossing the row.
      The trick is the inner `flex-col items-start` whose width is dictated by
      the buttons row below it; the outer `justify-end` pushes that whole
      column to the right edge. On sm+ everything flattens back inline.
    -->
    <div class="flex w-full justify-end sm:w-auto sm:justify-start">
      <div class="flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:gap-3">
        <app-freshness-indicator [updatedAt]="pageFetchedAt()" />

        <!--
          Button row. On mobile each secondary button (Actualizar / Papelera)
          shrinks to icon-only so all three actions fit on a single row at 360
          px viewports — wrapping the label text in `hidden sm:inline` is what
          does the work. matTooltip + aria-label are mandatory when the visible
          text disappears. The primary CTA keeps "Nuevo" visible always and
          appends the entity name on sm+ so the action is never reduced to a
          bare "+" icon.
        -->
        <div class="flex flex-row items-center gap-2 sm:gap-3">
          <button
            mat-stroked-button
            (click)="onRefresh()"
            [disabled]="loading()"
            matTooltip="Actualizar"
            aria-label="Actualizar"
          >
            <mat-icon class="material-symbols-outlined">refresh</mat-icon>
            <span class="hidden sm:inline">Actualizar</span>
          </button>
          @if (isAdmin()) {
            <!--
              Admin-only access to the soft-delete papelera. Sibling action on
              the parent surface, not a peer destination in the sidebar — same
              pattern used on `/afiliados`.
            -->
            <a
              mat-stroked-button
              routerLink="/servicios/eliminados"
              matTooltip="Ver servicios eliminados"
              aria-label="Papelera"
            >
              <mat-icon class="material-symbols-outlined">delete_outline</mat-icon>
              <span class="hidden sm:inline">Papelera</span>
            </a>
          }
          <a mat-flat-button color="primary" routerLink="/servicios/nuevo">
            <mat-icon class="material-symbols-outlined">add</mat-icon>
            Nuevo<span class="hidden sm:inline"> servicio</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <mat-card
    class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
  >
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          matTooltip="Limpiar todos los filtros aplicados"
          aria-label="Limpiar filtros"
        >
          <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
          Limpiar filtros
        </button>
      }

      <span class="flex-1"></span>

      <div class="flex items-center gap-1 shrink-0">
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onShowDetail()"
          matTooltip="Ver detalle"
          aria-label="Ver detalle del servicio seleccionado"
        >
          <mat-icon class="material-symbols-outlined">visibility</mat-icon>
        </button>
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onEdit()"
          matTooltip="Editar"
          aria-label="Editar servicio seleccionado"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          [disabled]="!hasSelection()"
          (click)="onDelete()"
          matTooltip="Eliminar"
          aria-label="Eliminar servicio seleccionado"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </div>

    <app-data-table
      [data]="rows()"
      [columns]="columns()"
      [trackBy]="trackById"
      storageKey="funerals.list"
      [serverSide]="true"
      [loading]="loading()"
      [totalElements]="totalElements()"
      [initialSort]="sortState()"
      [initialPageIndex]="pageIndex()"
      [initialPageSize]="pageSize()"
      [columnFilters]="columnFilters()"
      [emptyState]="emptyState()"
      [selectable]="true"
      [(selectedRow)]="selectedFuneral"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (columnMenuApply)="onColumnMenuApply($event)"
    />
  </mat-card>
</div>

<!--
  Cell renderers projected into the data-table via the `cellTemplate` slot on each
  column descriptor. The column's `value` accessor still returns the raw sortable
  value (ISO string / number) so the grid sort stays chronological / numeric.
-->
<ng-template #funeralDateCell let-funeral>{{ formatDateTime(funeral.funeralDate) }}</ng-template>
<ng-template #totalCell let-funeral>{{ formatCurrency(funeral.totalAmount) }}</ng-template>
