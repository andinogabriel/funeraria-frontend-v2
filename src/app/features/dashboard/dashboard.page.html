<div class="dashboard">
  <!-- Soft mesh-gradient backdrop. Pure CSS in dashboard.page.scss; the absolute
       positioning keeps it strictly behind the content so the bento tiles can use
       backdrop-filter for the glass effect. -->
  <div class="dashboard__mesh" aria-hidden="true"></div>

  <div class="dashboard__content">
    <app-dashboard-hero-carousel [slides]="heroSlides" />

    <section aria-label="Atajos rápidos" class="dashboard__quick">
      <app-quick-actions-bar [actions]="quickActions()" />
    </section>

    <!-- Bento grid: KPIs share a 4-column row on desktop, collapse to 2 → 1
         on smaller screens; the activity feed sits in its own card under the
         KPIs on mobile and side-by-side on desktop. -->
    <section class="dashboard__bento" aria-label="Resumen operativo">
      <div class="dashboard__kpis">
        <app-kpi-tile
          icon="group"
          label="Afiliados activos"
          tone="primary"
          hint="vs. mes anterior"
          [trend]="4"
          [sparkline]="affiliatesSpark"
        />
        <app-kpi-tile
          icon="workspace_premium"
          label="Planes activos"
          tone="secondary"
          hint="vs. mes anterior"
          [trend]="2"
          [sparkline]="plansSpark"
        />
        <app-kpi-tile
          icon="church"
          label="Servicios del mes"
          tone="tertiary"
          hint="vs. mes anterior"
          [trend]="-1"
          [sparkline]="funeralsSpark"
        />
        <app-kpi-tile
          icon="policy"
          label="Eventos auditados (24 h)"
          tone="neutral"
          [trend]="null"
          [sparkline]="auditSpark"
        />
      </div>

      <article class="dashboard__activity">
        <header class="dashboard__activity-head">
          <h2 class="dashboard__activity-title">Actividad reciente</h2>
          <p class="dashboard__activity-sub">
            Últimos eventos de la consola — datos en vivo cuando el broker se conecte.
          </p>
        </header>
        <app-activity-feed [items]="recentActivity" />
      </article>
    </section>
  </div>
</div>
