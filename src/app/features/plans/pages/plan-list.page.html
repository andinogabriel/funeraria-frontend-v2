<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      workspace_premium
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Planes</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Catálogo de planes funerarios disponibles.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header controls cluster. Plans does not own a freshness indicator (the
      catalog rarely changes), so the wrapper exists just to apply the same
      mobile row-aligned shape every other list page uses: Actualizar /
      Papelera / Nuevo plan sit on a single row instead of each wrapping onto
      its own line under the title block.
    -->
    <!--
      Button row. Mobile: Actualizar / Papelera collapse to icon-only via
      `hidden sm:inline`; matTooltip + aria-label preserve discoverability
      and accessibility. Primary CTA keeps "Nuevo" visible always.
    -->
    <div class="flex flex-row items-center justify-end gap-2 sm:gap-3">
      <button
        mat-stroked-button
        (click)="onRefresh()"
        [disabled]="loading()"
        matTooltip="Actualizar"
        aria-label="Actualizar"
      >
        <mat-icon class="material-symbols-outlined">refresh</mat-icon>
        <span class="hidden sm:inline">Actualizar</span>
      </button>
      @if (isAdmin()) {
        <!--
          Admin-only access to the soft-delete papelera. Sibling action on the
          parent surface, not a peer destination in the sidebar — same pattern
          used on `/afiliados` and `/servicios`.
        -->
        <a
          mat-stroked-button
          routerLink="/planes/eliminados"
          matTooltip="Ver planes eliminados"
          aria-label="Papelera"
        >
          <mat-icon class="material-symbols-outlined">delete_outline</mat-icon>
          <span class="hidden sm:inline">Papelera</span>
        </a>
      }
      <a mat-flat-button color="primary" routerLink="/planes/nuevo">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
        Nuevo<span class="hidden sm:inline"> plan</span>
      </a>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <app-selection-list-card
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackById"
    storageKey="plans.list"
    [initialSort]="{ active: 'name', direction: 'asc' }"
    [loading]="loading()"
    emptyIcon="workspace_premium"
    emptyTitle="No hay planes que coincidan con la búsqueda."
    emptyHint="Probá con otro criterio o sumá un nuevo plan."
    [actions]="actions()"
    [(selectedRow)]="selectedPlan"
  />
</div>
