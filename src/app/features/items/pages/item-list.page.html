<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      inventory_2
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Items</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Catálogo de items disponibles para armar planes funerarios.
      </p>
    </div>
    <span class="flex-1"></span>

    <!--
      Header controls cluster. On mobile (default) we stack the freshness
      indicator ABOVE the row of action buttons so Actualizar / Papelera /
      Nuevo item sit on a single row instead of each wrapping onto its own
      line. On sm+ everything sits inline as it always did.
    -->
    <div
      class="flex w-full flex-col items-end gap-2 sm:w-auto sm:flex-row sm:items-center sm:gap-3"
    >
      <app-freshness-indicator [updatedAt]="pageFetchedAt()" />

      <div class="flex flex-row flex-wrap items-center justify-end gap-2 sm:gap-3">
        <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
          <mat-icon class="material-symbols-outlined">refresh</mat-icon>
          Actualizar
        </button>
        @if (isAdmin()) {
          <!--
            Admin-only access to the soft-delete papelera. Sibling action on the
            parent surface, not a peer destination in the sidebar — same pattern
            used on `/afiliados`, `/servicios`, and `/planes`.
          -->
          <a
            mat-stroked-button
            routerLink="/items/eliminados"
            matTooltip="Ver items eliminados"
            aria-label="Papelera"
          >
            <mat-icon class="material-symbols-outlined">delete_outline</mat-icon>
            Papelera
          </a>
        }
        <a mat-flat-button color="primary" routerLink="/items/nuevo">
          <mat-icon class="material-symbols-outlined">add</mat-icon>
          Nuevo item
        </a>
      </div>
    </div>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <mat-card
    class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
  >
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          matTooltip="Limpiar todos los filtros aplicados"
          aria-label="Limpiar filtros"
        >
          <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
          Limpiar filtros
        </button>
      }

      <span class="flex-1"></span>

      <div class="flex items-center gap-1 shrink-0">
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onShowDetail()"
          matTooltip="Ver detalle"
          aria-label="Ver detalle del item seleccionado"
        >
          <mat-icon class="material-symbols-outlined">visibility</mat-icon>
        </button>
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onEdit()"
          matTooltip="Editar"
          aria-label="Editar item seleccionado"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          [disabled]="!hasSelection()"
          (click)="onDelete()"
          matTooltip="Eliminar"
          aria-label="Eliminar item seleccionado"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </div>

    <app-data-table
      [data]="rows()"
      [columns]="columns"
      [trackBy]="trackByCode"
      storageKey="items.list"
      [serverSide]="true"
      [loading]="loading()"
      [totalElements]="totalElements()"
      [initialSort]="sortState()"
      [initialPageIndex]="pageIndex()"
      [initialPageSize]="pageSize()"
      [columnFilters]="columnFilters()"
      [emptyState]="emptyState()"
      [selectable]="true"
      [(selectedRow)]="selectedItem"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (columnMenuApply)="onColumnMenuApply($event)"
    />
  </mat-card>
</div>
