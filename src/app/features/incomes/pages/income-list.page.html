<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      receipt_long
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Ingresos</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Compras a proveedores con detalle de items, impuesto y total.
      </p>
    </div>
    <span class="flex-1"></span>

    <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
      <mat-icon class="material-symbols-outlined">refresh</mat-icon>
      Actualizar
    </button>
    <a mat-flat-button color="primary" routerLink="/ingresos/nuevo">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      Nuevo ingreso
    </a>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <!--
    Action toolbar: icon-only, 48 px tap targets, tooltips for the label. The three
    icons stay disabled until the operator selects a row in the table; behaviour
    after selection is unchanged from the previous text+icon variant.

    The "Limpiar filtros" affordance lives here too — it only appears when any
    column filter is active. The per-column "clear" sits inside each column menu;
    this one wipes them all in a single tap.
  -->
  <div class="flex flex-wrap items-center gap-2">
    <button
      mat-icon-button
      class="!w-12 !h-12"
      [disabled]="!hasSelection()"
      (click)="onShowDetail()"
      matTooltip="Ver detalle"
      aria-label="Ver detalle del ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">visibility</mat-icon>
    </button>
    <button
      mat-icon-button
      class="!w-12 !h-12"
      [disabled]="!hasSelection()"
      (click)="onEdit()"
      matTooltip="Editar"
      aria-label="Editar ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">edit</mat-icon>
    </button>
    <button
      mat-icon-button
      class="!w-12 !h-12"
      color="warn"
      [disabled]="!hasSelection()"
      (click)="onDelete()"
      matTooltip="Eliminar"
      aria-label="Eliminar ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">delete</mat-icon>
    </button>

    <span class="flex-1"></span>

    @if (hasActiveFilters()) {
      <button
        type="button"
        mat-stroked-button
        (click)="onClearFilters()"
        aria-label="Limpiar todos los filtros"
      >
        <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
        Limpiar filtros
      </button>
    }

    @if (loading()) {
      <span
        class="text-xs text-[var(--mat-sys-on-surface-variant)] inline-flex items-center gap-2 ml-2"
      >
        <mat-icon class="material-symbols-outlined animate-spin !text-base !w-4 !h-4">
          progress_activity
        </mat-icon>
        Actualizando…
      </span>
    }
  </div>

  <!--
    Server-side paginated table. Per-column filtering + sort happens inside the column
    header menus; the page just maps the events back to the URL. Empty state is
    rendered by the data-table inside its fixed-height body — no separate card below
    the table — so the page footprint stays stable across filter changes.
  -->
  <app-data-table
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackByReceiptNumber"
    storageKey="incomes.list"
    [serverSide]="true"
    [totalElements]="totalElements()"
    [initialSort]="sortState()"
    [initialPageIndex]="pageIndex()"
    [initialPageSize]="pageSize()"
    [columnFilters]="columnFilters()"
    [emptyState]="emptyState()"
    [selectable]="true"
    [(selectedRow)]="selectedIncome"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (columnFilterChange)="onColumnFilterChange($event)"
  />
</div>
