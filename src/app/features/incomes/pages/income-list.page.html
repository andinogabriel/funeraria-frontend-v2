<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      receipt_long
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Ingresos</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Compras a proveedores con detalle de items, impuesto y total.
      </p>
    </div>
    <span class="flex-1"></span>

    <app-freshness-indicator [updatedAt]="pageFetchedAt()" />

    <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
      <mat-icon class="material-symbols-outlined">refresh</mat-icon>
      Actualizar
    </button>
    <a mat-flat-button color="primary" routerLink="/ingresos/nuevo">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      Nuevo ingreso
    </a>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <!--
    Mat-card wrapper + in-card toolbar match the structure used by the other
    server-side list views (affiliates / items / funerals). The toolbar carries
    the "Limpiar filtros" affordance on the LEFT when at least one filter is
    committed, plus the icon-only row actions on the RIGHT (44 px circular tap
    targets with Spanish tooltips). First-load shows the data-table's inline
    skeleton; refresh fetches keep the previous rows visible (stale-while-
    revalidate) so the table never flashes.
  -->
  <mat-card
    class="!rounded-xl flex flex-col overflow-y-auto sm:!overflow-hidden max-h-[calc(100dvh-200px)] sm:max-h-none"
  >
    <div
      class="flex flex-row items-center gap-2 sm:gap-3 px-4 sm:px-6 py-4 border-b border-[var(--mat-sys-outline-variant)] shrink-0"
    >
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          matTooltip="Limpiar todos los filtros aplicados"
          aria-label="Limpiar filtros"
        >
          <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
          Limpiar filtros
        </button>
      }

      <span class="flex-1"></span>

      <div class="flex items-center gap-1 shrink-0">
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onShowDetail()"
          matTooltip="Ver detalle"
          aria-label="Ver detalle del ingreso seleccionado"
        >
          <mat-icon class="material-symbols-outlined">visibility</mat-icon>
        </button>
        <button
          mat-icon-button
          [disabled]="!hasSelection()"
          (click)="onEdit()"
          matTooltip="Editar"
          aria-label="Editar ingreso seleccionado"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          [disabled]="!hasSelection()"
          (click)="onDelete()"
          matTooltip="Eliminar"
          aria-label="Eliminar ingreso seleccionado"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    </div>

    <app-data-table
      [data]="rows()"
      [columns]="columns()"
      [trackBy]="trackByReceiptNumber"
      storageKey="incomes.list"
      [serverSide]="true"
      [loading]="loading()"
      [totalElements]="totalElements()"
      [initialSort]="sortState()"
      [initialPageIndex]="pageIndex()"
      [initialPageSize]="pageSize()"
      [columnFilters]="columnFilters()"
      [emptyState]="emptyState()"
      [selectable]="true"
      [(selectedRow)]="selectedIncome"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (columnMenuApply)="onColumnMenuApply($event)"
    />
  </mat-card>
</div>

<!--
  Cell renderer projected into the data-table via the `cellTemplate` slot on
  the Fecha column descriptor. The column's `value` accessor still returns the
  raw ISO 8601 instant so the grid sort stays chronological; the template
  formats the value as `dd/MM/yyyy HH:mm` in the operator's local timezone.
-->
<ng-template #incomeDateCell let-income>{{ formatDateTime(income.incomeDate) }}</ng-template>
