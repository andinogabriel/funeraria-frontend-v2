<div class="flex flex-col gap-6">
  <header class="flex flex-wrap items-center gap-3">
    <mat-icon class="material-symbols-outlined !text-3xl !w-8 !h-8 text-[var(--mat-sys-primary)]">
      receipt_long
    </mat-icon>
    <div class="flex flex-col">
      <h1 class="text-2xl lg:text-3xl font-semibold m-0 leading-tight">Ingresos</h1>
      <p class="text-sm text-[var(--mat-sys-on-surface-variant)] m-0">
        Compras a proveedores con detalle de items, impuesto y total.
      </p>
    </div>
    <span class="flex-1"></span>

    <button mat-stroked-button (click)="onRefresh()" [disabled]="loading()">
      <mat-icon class="material-symbols-outlined">refresh</mat-icon>
      Actualizar
    </button>
    <a mat-flat-button color="primary" routerLink="/ingresos/nuevo">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      Nuevo ingreso
    </a>
  </header>

  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md p-3 text-sm bg-[var(--mat-sys-error-container)] text-[var(--mat-sys-on-error-container)]"
    >
      {{ message }}
    </div>
  }

  <!--
    Action toolbar. Left: loading hint + "Limpiar filtros". Right: row actions
    (icon-only 48 px tap targets with Spanish tooltips). Each button is disabled
    until the operator selects a row in the table; Eliminar still routes through
    the confirm dialog so the behaviour is unchanged.
  -->
  <div class="flex flex-wrap items-center gap-2">
    @if (loading()) {
      <span class="text-xs text-[var(--mat-sys-on-surface-variant)] inline-flex items-center gap-2">
        <mat-icon class="material-symbols-outlined animate-spin !text-base !w-4 !h-4">
          progress_activity
        </mat-icon>
        Actualizando…
      </span>
    }

    @if (hasActiveFilters()) {
      <button
        type="button"
        mat-stroked-button
        (click)="onClearFilters()"
        aria-label="Limpiar todos los filtros"
      >
        <mat-icon class="material-symbols-outlined">filter_alt_off</mat-icon>
        Limpiar filtros
      </button>
    }

    <span class="flex-1"></span>

    <button
      mat-icon-button
      class="!w-12 !h-12"
      [disabled]="!hasSelection()"
      (click)="onShowDetail()"
      matTooltip="Ver más info"
      aria-label="Ver más info del ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">visibility</mat-icon>
    </button>
    <button
      mat-icon-button
      class="!w-12 !h-12"
      [disabled]="!hasSelection()"
      (click)="onEdit()"
      matTooltip="Editar"
      aria-label="Editar ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">edit</mat-icon>
    </button>
    <button
      mat-icon-button
      class="!w-12 !h-12"
      color="warn"
      [disabled]="!hasSelection()"
      (click)="onDelete()"
      matTooltip="Eliminar"
      aria-label="Eliminar ingreso seleccionado"
    >
      <mat-icon class="material-symbols-outlined">delete</mat-icon>
    </button>
  </div>

  <!--
    Server-side paginated table. Column-header menus stage filter + sort and commit
    via the Aceptar button; the page wires the events into URL params
    (`receiptNumber`, `supplierNif`, `from`, `to`). Column chooser is hidden — this
    page ships a curated column set. Empty state lives inside the table so the page
    footprint stays stable.
  -->
  <app-data-table
    [data]="rows()"
    [columns]="columns"
    [trackBy]="trackByReceiptNumber"
    storageKey="incomes.list"
    [serverSide]="true"
    [totalElements]="totalElements()"
    [initialSort]="sortState()"
    [initialPageIndex]="pageIndex()"
    [initialPageSize]="pageSize()"
    [columnFilters]="columnFilters()"
    [emptyState]="emptyState()"
    [selectable]="true"
    [(selectedRow)]="selectedIncome"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (columnMenuApply)="onColumnMenuApply($event)"
  />
</div>
